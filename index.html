<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neville Pronos | Pronostics, Classements & Stats - Vérifié</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a;margin:0}
.header{background:#2563eb;color:white;padding:22px 15px;text-align:center;border-bottom:4px solid #f97316}
.header h1{margin:0;font-size:24px}
.header p{margin:6px 0 0;opacity:0.9;font-size:13px}
.truth-bar{background:#fef3c7;color:#92400e;padding:10px 15px;text-align:center;font-size:12px;font-weight:bold}
.direct-box{background:#0f172a;color:white;padding:14px 15px}
.live-dot{width:10px;height:10px;background:#dc2626;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0.2}100%{opacity:1}}
.direct-card{background:white;color:#0f172a;padding:12px;border-radius:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.direct-score{background:#16a34a;color:white;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:16px}
.info-box{background:white;padding:14px;border-radius:12px;max-width:620px;margin:12px auto;box-shadow:0 2px 8px rgba(0,0,0,0.07);font-size:13px;line-height:1.5}
.vip{background:#16a34a;color:white;padding:16px;border-radius:14px;text-align:center;max-width:620px;margin:12px auto}
.vip a{background:white;color:#16a34a;padding:12px 20px;border-radius:25px;font-weight:bold;text-decoration:none;display:inline-block;margin-top:10px}
.leagues,.stand-tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 15px;max-width:650px;margin:0 auto;scrollbar-width:none}
.leagues button,.stand-tabs button{white-space:nowrap;padding:10px 16px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;background:white;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
.leagues button.active{background:#2563eb;color:white}
.stand-tabs button.active{background:#0f172a;color:white}
.filters{padding:0 15px;max-width:650px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
.filters input{flex:1;min-width:140px;padding:11px;border:none;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
.filters button{padding:11px 14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;background:white}
.filters button.active{background:#2563eb;color:white}
.tabs{display:flex;gap:10px;padding:15px;max-width:650px;margin:0 auto}
